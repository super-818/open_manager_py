<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开源资源管理器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>开源资源管理器</h1>
            <div class="header-actions">
                <button id="themeToggle" class="btn btn-icon" title="切换主题">🌙</button>
                <button id="scanBtn" class="btn btn-primary">扫描目录</button>
                <button id="exportBtn" class="btn btn-secondary">导出</button>
                <button id="importBtn" class="btn btn-secondary">导入</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="dashboard">仪表盘</button>
            <button class="tab-btn" data-tab="skills">技能管理</button>
            <button class="tab-btn" data-tab="projects">项目管理</button>
        </nav>

        <main class="content">
            <div id="dashboard-tab" class="tab-content active">
                <div id="statsContainer" class="stats-container">
                    <div class="stats-loading">加载统计中...</div>
                </div>
            </div>

            <div id="skills-tab" class="tab-content">
                <div class="toolbar">
                    <input type="text" id="skillSearch" placeholder="搜索技能..." class="search-input">
                    <select id="skillCategory" class="select-input">
                        <option value="">全部分类</option>
                    </select>
                    <input type="text" id="skillTags" placeholder="标签(逗号分隔)" class="search-input" style="flex: 0.5;">
                    <select id="skillSort" class="select-input">
                        <option value="name">按名称 A-Z</option>
                        <option value="name_desc">按名称 Z-A</option>
                        <option value="size_desc">按大小 大→小</option>
                        <option value="size">按大小 小→大</option>
                        <option value="time_desc">按更新时间 新→旧</option>
                        <option value="time">按更新时间 旧→新</option>
                    </select>
                    <button id="distributeSkillsBtn" class="btn btn-secondary">分发技能</button>
                </div>
                <div id="skillsList" class="resource-list"></div>
            </div>

            <div id="projects-tab" class="tab-content">
                <div class="toolbar">
                    <input type="text" id="projectSearch" placeholder="搜索项目..." class="search-input">
                    <select id="projectCategory" class="select-input">
                        <option value="">全部分类</option>
                    </select>
                    <input type="text" id="projectTags" placeholder="标签(逗号分隔)" class="search-input" style="flex: 0.5;">
                    <select id="projectSort" class="select-input">
                        <option value="name">按名称 A-Z</option>
                        <option value="name_desc">按名称 Z-A</option>
                        <option value="size_desc">按大小 大→小</option>
                        <option value="size">按大小 小→大</option>
                        <option value="time_desc">按更新时间 新→旧</option>
                        <option value="time">按更新时间 旧→新</option>
                    </select>
                    <button id="checkUpdatesBtn" class="btn btn-secondary">检测更新</button>
                    <button id="exportPathsBtn" class="btn btn-secondary">导出路径</button>
                    <button id="updateAllBtn" class="btn btn-primary">一键更新</button>
                </div>
                <div id="projectsList" class="resource-list"></div>
            </div>
        </main>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">编辑资源</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editCategory">分类</label>
                    <div class="category-select-wrapper">
                        <select id="editCategorySelect" class="select-input category-select">
                            <option value="">选择分类...</option>
                            <option value="__custom__">自定义分类...</option>
                        </select>
                        <input type="text" id="editCategoryCustom" class="form-input category-custom-input" placeholder="输入自定义分类名称" style="display:none;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="editTags">标签（用逗号分隔）</label>
                    <input type="text" id="editTags" class="form-input">
                </div>
                <div class="form-group">
                    <label for="editNotes">备注</label>
                    <textarea id="editNotes" class="form-textarea" rows="4"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelBtn" class="btn btn-secondary">取消</button>
                <button id="saveBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <div id="distributeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>分发技能</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>选择目标工具</label>
                    <div id="distributeToolOptions" class="tool-options">
                        <div class="loading-tools">加载工具列表...</div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="customPath">自定义路径（可选）</label>
                    <input type="text" id="customPath" class="form-input" placeholder="输入自定义.skill目录路径">
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelDistributeBtn" class="btn btn-secondary">取消</button>
                <button id="confirmDistributeBtn" class="btn btn-primary">确认分发</button>
            </div>
        </div>
    </div>

    <div id="readmeModal" class="modal">
        <div class="modal-content readme-modal-content">
            <div class="modal-header">
                <h2 id="readmeModalTitle">README</h2>
                <button class="close-btn" onclick="closeReadmeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="readmeContent" class="readme-content">
                    <div class="readme-loading">加载中...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeReadmeModal()">关闭</button>
            </div>
        </div>
    </div>

    <div id="importModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>导入数据</h2>
                <button class="close-btn" onclick="closeImportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="importFile">选择 JSON 文件</label>
                    <input type="file" id="importFile" accept=".json" class="form-input">
                </div>
                <div class="form-hint">导入将更新现有记录的分类、标签和备注，不会创建新记录。</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeImportModal()">取消</button>
                <button id="confirmImportBtn" class="btn btn-primary">导入</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="progressModal" class="modal">
        <div class="modal-content progress-modal">
            <div class="modal-header">
                <h2 id="progressTitle">更新项目</h2>
                <button class="close-btn" onclick="closeProgressModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="progress-container">
                    <div class="progress-title" id="progressSubtitle">准备更新...</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar" style="width: 0%;">
                            <span class="progress-bar-text" id="progressBarText">0%</span>
                        </div>
                    </div>
                </div>
                <div class="progress-details" id="progressDetails"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeProgressModal()" id="closeProgressModalBtn" style="display: none;">关闭</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
